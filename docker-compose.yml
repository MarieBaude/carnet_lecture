version: '3.8'

services:
  app:
    build: 
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: carnet-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=carnet_lecture
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # MinIO / S3
      - FILESYSTEM_DISK=s3
      - AWS_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=carnet-lecture
      - AWS_URL=http://localhost:9000/carnet-lecture
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - carnet-network
    healthcheck:                                   
      test: ["CMD", "php", "artisan", "inspire"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:16-alpine
    container_name: carnet-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=carnet_lecture
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - carnet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d carnet_lecture"]
      interval: 10s
      timeout: 5s
      retries: 5

  front:
    build: 
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: carnet-front
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api/v1
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - carnet-network
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

  minio:
    image: minio/minio:latest
    container_name: carnet-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - carnet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    
volumes:
  postgres-data:
    driver: local
  vendor-data:
    driver: local    
  node-data:
    driver: local   
  minio-data:
    driver: local

networks:
  carnet-network:
    driver: bridge
    name: carnet-lecture-network