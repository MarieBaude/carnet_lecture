version: '3.8'

services:
  app:
    build: 
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: carnet-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=carnet_lecture
      - DB_USERNAME=admin
      - DB_PASSWORD=secret
      - COMPOSER_MEMORY_LIMIT=-1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carnet-network
    healthcheck:
      test: ["CMD", "php", "artisan", "inspire"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:16-alpine
    container_name: carnet-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=carnet_lecture
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - carnet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d carnet_lecture"]
      interval: 10s
      timeout: 5s
      retries: 5

  front:
    build: 
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: carnet-front
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # PAS de volume anonyme pour node_modules !
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api/v1
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - carnet-network
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres-data:
    driver: local

networks:
  carnet-network:
    driver: bridge
    name: carnet-lecture-network